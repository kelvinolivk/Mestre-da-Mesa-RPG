<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Mestre da Mesa 🏓</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    user-select:none;
}


/* =========================
TELA DO JOGO
========================= */

#jogo{

    width:100vw;
    height:100vh;

    background:
    linear-gradient(
        #183d27 0%,
        #183d27 55%,
        #74451f 55%,
        #74451f 100%
    );

    position:relative;
    overflow:hidden;
}


/* =========================
TÍTULO
========================= */

#titulo{

    position:absolute;

    top:10px;
    left:0;
    width:100%;

    text-align:center;

    font-size:28px;
    font-weight:bold;

    text-shadow:3px 3px 4px #000;

    z-index:10;
}


/* =========================
ARENA
========================= */

#mesa{

    position:absolute;

    width:75%;
    height:28%;

    left:12.5%;
    top:38%;

    background:#176b35;

    border:8px solid #ddd;

    border-radius:5px;

    box-shadow:
    0 10px 20px #000;

}


#rede{

    position:absolute;

    width:5px;
    height:100%;

    left:50%;

    top:0;

    background:white;

}


/* =========================
JOGADOR
========================= */

.personagem{

    position:absolute;

    text-align:center;

    font-size:55px;

    z-index:5;

}


#jogador{

    left:8%;
    bottom:20%;

}


#adversario{

    right:8%;
    top:20%;

}


/* =========================
NOMES
========================= */

.nome{

    display:block;

    font-size:15px;

    background:#000;

    padding:5px 10px;

    border-radius:8px;

}


/* =========================
BARRAS
========================= */

.status{

    position:absolute;

    width:40%;

    top:75px;

    padding:8px;

    background:#222;

    border-radius:10px;

}


#statusJogador{

    left:3%;

}


#statusAdversario{

    right:3%;

}


.barra{

    height:14px;

    background:#555;

    border-radius:10px;

    overflow:hidden;

    margin-top:5px;

}


.vida{

    height:100%;

    background:#19d65a;

    width:100%;

}


.energia{

    height:100%;

    background:#2e9cff;

    width:100%;

}


/* =========================
MENSAGEM
========================= */

#mensagem{

    position:absolute;

    left:5%;

    width:90%;

    bottom:12%;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    text-shadow:2px 2px 3px #000;

}


/* =========================
BOTÕES
========================= */

#controles{

    position:absolute;

    bottom:2%;

    left:0;

    width:100%;

    display:flex;

    justify-content:center;

    gap:8px;

}


button{

    border:0;

    border-radius:12px;

    padding:14px 10px;

    min-width:28%;

    background:#168f45;

    color:white;

    font-size:15px;

    font-weight:bold;

    box-shadow:0 4px 8px #000;

}


button:active{

    transform:scale(.94);

}


#fim{

    display:none;

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.88);

    z-index:100;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

}


#fim h2{

    font-size:42px;

    margin:10px;

}


#fim p{

    font-size:20px;

}


#fim button{

    width:70%;

    margin-top:20px;

}


/* =========================
RESPONSIVO
========================= */

@media(min-width:700px){

    #mesa{

        width:500px;

        left:calc(50% - 250px);

    }

}

</style>

</head>


<body>


<div id="jogo">


<div id="titulo">

🏓 MESTRE DA MESA

</div>


<!-- STATUS DO JOGADOR -->

<div
class="status"
id="statusJogador">

🏓 Você

<div class="barra">

<div
id="vidaJogador"
class="vida">
</div>

</div>

<div class="barra">

<div
id="energiaJogador"
class="energia">
</div>

</div>

❤️ <span id="vidaTexto">100</span>
⚡ <span id="energiaTexto">100</span>

</div>


<!-- STATUS DO ADVERSÁRIO -->

<div
class="status"
id="statusAdversario">

⚽ Jogador de Futebol

<div class="barra">

<div
id="vidaAdversario"
class="vida">
</div>

</div>

❤️ <span id="vidaAdvTexto">100</span>

</div>


<!-- MESA -->

<div id="mesa">

<div id="rede"></div>

</div>


<!-- JOGADOR -->

<div
class="personagem"
id="jogador">

🏓

<span class="nome">

Mestre da Mesa

</span>

</div>


<!-- ADVERSÁRIO -->

<div
class="personagem"
id="adversario">

⚽

<span class="nome">

Craque da Bola

</span>

</div>


<!-- MENSAGEM -->

<div id="mensagem">

⚔️ O duelo começou!

</div>


<!-- CONTROLES -->

<div id="controles">

<button onclick="atacar()">

🏓<br>

TOPSPIN

</button>


<button onclick="smash()">

🔥<br>

SMASH

</button>


<button onclick="defender()">

🛡️<br>

DEFENDER

</button>

</div>


<!-- TELA FINAL -->

<div id="fim">

<h2 id="tituloFim">

🏆 VITÓRIA!

</h2>

<p id="textoFim">

Você venceu!

</p>

<button onclick="location.reload()">

🔄 Jogar novamente

</button>

</div>


</div>


<script>


// =========================
// ESTADO DO JOGO
// =========================

let vidaJogador = 100;

let energia = 100;

let vidaAdversario = 100;

let defendendo = false;


// =========================
// ATUALIZAR TELA
// =========================

function atualizar(){

    document.getElementById(
        "vidaJogador"
    ).style.width =
        vidaJogador + "%";


    document.getElementById(
        "energiaJogador"
    ).style.width =
        energia + "%";


    document.getElementById(
        "vidaAdversario"
    ).style.width =
        vidaAdversario + "%";


    document.getElementById(
        "vidaTexto"
    ).innerText =
        vidaJogador;


    document.getElementById(
        "energiaTexto"
    ).innerText =
        energia;


    document.getElementById(
        "vidaAdvTexto"
    ).innerText =
        vidaAdversario;

}


// =========================
// ATAQUE NORMAL
// =========================

function atacar(){

    if(vidaJogador <= 0) return;

    if(energia < 10){

        mensagem(
            "⚡ Você está sem energia!"
        );

        return;

    }


    energia -= 10;

    let dano =
        Math.floor(
            Math.random() * 11
        ) + 10;


    vidaAdversario -= dano;


    mensagem(
        "🏓 TOPSPIN! Você causou " +
        dano +
        " de dano!"
    );


    verificarFim();


    if(
        vidaAdversario > 0
    ){

        setTimeout(
            turnoAdversario,
            700
        );

    }


    atualizar();

}


// =========================
// SMASH
// =========================

function smash(){

    if(energia < 30){

        mensagem(
            "⚡ Energia insuficiente para o SMASH!"
        );

        return;

    }


    energia -= 30;


    let dano =
        Math.floor(
            Math.random() * 21
        ) + 20;


    vidaAdversario -= dano;


    mensagem(
        "🔥 SMASH DEVASTADOR! " +
        dano +
        " de dano!"
    );


    verificarFim();


    if(
        vidaAdversario > 0
    ){

        setTimeout(
            turnoAdversario,
            700
        );

    }


    atualizar();

}


// =========================
// DEFENDER
// =========================

function defender(){

    defendendo = true;

    energia += 15;


    if(energia > 100)
        energia = 100;


    mensagem(
        "🛡️ Você entrou em posição defensiva!"
    );


    setTimeout(
        turnoAdversario,
        500
    );


    atualizar();

}


// =========================
// TURNO DO ADVERSÁRIO
// =========================

function turnoAdversario(){

    if(
        vidaAdversario <= 0 ||
        vidaJogador <= 0
    ){

        return;

    }


    let dano =
        Math.floor(
            Math.random() * 16
        ) + 8;


    if(defendendo){

        dano =
            Math.floor(
                dano / 2
            );

        defendendo = false;

        mensagem(
            "🛡️ Você defendeu o ataque!"
        );

    }else{

        mensagem(
            "⚽ O jogador de futebol atacou!"
        );

    }


    vidaJogador -= dano;


    if(
        vidaJogador < 0
    )
        vidaJogador = 0;


    atualizar();


    verificarFim();

}


// =========================
// VERIFICAR FINAL
// =========================

function verificarFim(){

    if(
        vidaAdversario <= 0
    ){

        vidaAdversario = 0;

        atualizar();

        document.getElementById(
            "fim"
        ).style.display =
            "flex";


        document.getElementById(
            "tituloFim"
        ).innerText =
            "🏆 VITÓRIA!";


        document.getElementById(
            "textoFim"
        ).innerText =
            "Você derrotou o jogador de futebol! ⚽🏓";


        return;

    }


    if(
        vidaJogador <= 0
    ){

        vidaJogador = 0;

        atualizar();

        document.getElementById(
            "fim"
        ).style.display =
            "flex";


        document.getElementById(
            "tituloFim"
        ).innerText =
            "💀 DERROTA";


        document.getElementById(
            "textoFim"
        ).innerText =
            "O Craque da Bola venceu desta vez.";


    }

}


// =========================
// MENSAGEM
// =========================

function mensagem(texto){

    document.getElementById(
        "mensagem"
    ).innerText =
        texto;

}


// =========================
// INICIAR
// =========================

atualizar();

</script>


</body>

</html>
