<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Mestre da Mesa 🏓</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
    user-select:none;
}

#jogo{
    width:100vw;
    height:100vh;

    background:
    linear-gradient(
        #183d27 0%,
        #183d27 55%,
        #74451f 55%,
        #74451f 100%
    );

    position:relative;
    overflow:hidden;
}

#titulo{
    position:absolute;
    top:8px;
    left:0;
    width:100%;
    text-align:center;
    font-size:27px;
    font-weight:bold;
    text-shadow:3px 3px 4px #000;
    z-index:10;
}

/* =========================
PAINEL RPG
========================= */

#rpg{
    position:absolute;
    top:42px;
    left:3%;
    width:94%;
    display:flex;
    justify-content:space-between;
    z-index:20;
    font-weight:bold;
}

.rpgBox{
    background:rgba(0,0,0,.75);
    padding:7px 12px;
    border-radius:10px;
    border:1px solid #555;
    font-size:14px;
}

/* =========================
ARENA
========================= */

#mesa{
    position:absolute;
    width:75%;
    height:28%;
    left:12.5%;
    top:38%;
    background:#176b35;
    border:8px solid #ddd;
    border-radius:5px;
    box-shadow:0 10px 20px #000;
}

#rede{
    position:absolute;
    width:5px;
    height:100%;
    left:50%;
    top:0;
    background:white;
}

/* =========================
PERSONAGENS
========================= */

.personagem{
    position:absolute;
    text-align:center;
    font-size:55px;
    z-index:5;
}

#jogador{
    left:8%;
    bottom:20%;
}

#adversario{
    right:8%;
    top:20%;
}

.nome{
    display:block;
    font-size:15px;
    background:#000;
    padding:5px 10px;
    border-radius:8px;
}

/* =========================
STATUS
========================= */

.status{
    position:absolute;
    width:40%;
    top:78px;
    padding:8px;
    background:#222;
    border-radius:10px;
    z-index:15;
}

#statusJogador{
    left:3%;
}

#statusAdversario{
    right:3%;
}

.barra{
    height:14px;
    background:#555;
    border-radius:10px;
    overflow:hidden;
    margin-top:5px;
}

.vida{
    height:100%;
    background:#19d65a;
    width:100%;
}

.energia{
    height:100%;
    background:#2e9cff;
    width:100%;
}

/* =========================
MENSAGEM
========================= */

#mensagem{
    position:absolute;
    left:5%;
    width:90%;
    bottom:12%;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
}

/* =========================
BOTÕES
========================= */

#controles{
    position:absolute;
    bottom:2%;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:8px;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 10px;
    min-width:28%;
    background:#168f45;
    color:white;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 4px 8px #000;
}

button:active{
    transform:scale(.94);
}

button:disabled{
    opacity:.45;
}

/* =========================
TELA FINAL
========================= */

#fim{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:100;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

#fim h2{
    font-size:40px;
    margin:10px;
}

#fim p{
    font-size:19px;
    line-height:1.6;
}

#fim button{
    width:75%;
    margin-top:15px;
}

/* =========================
RESPONSIVO
========================= */

@media(min-width:700px){

    #mesa{
        width:500px;
        left:calc(50% - 250px);
    }

}

</style>

</head>

<body>

<div id="jogo">

<div id="titulo">
🏓 MESTRE DA MESA
</div>

<!-- =========================
PAINEL RPG
========================= -->

<div id="rpg">

```
<div class="rpgBox">
    🏓 Kelvin<br>
    ⭐ Nível <span id="nivel">1</span>
</div>

<div class="rpgBox">
    ⭐ XP: <span id="xp">0</span>/<span id="xpProximo">100</span><br>
    🪙 <span id="moedas">0</span>
</div>
```

</div>

<!-- =========================
STATUS JOGADOR
========================= -->

<div
class="status"
id="statusJogador">

🏓 Kelvin

<div class="barra">
<div
id="vidaJogador"
class="vida">
</div>
</div>

<div class="barra">
<div
id="energiaJogador"
class="energia">
</div>
</div>

❤️ <span id="vidaTexto">100</span>
⚡ <span id="energiaTexto">100</span>

</div>

<!-- =========================
STATUS ADVERSÁRIO
========================= -->

<div
class="status"
id="statusAdversario">

⚽ Sperandio

<div class="barra">
<div
id="vidaAdversario"
class="vida">
</div>
</div>

❤️ <span id="vidaAdvTexto">100</span>

</div>

<!-- =========================
MESA
========================= -->

<div id="mesa">

<div id="rede"></div>

</div>

<!-- =========================
JOGADOR
========================= -->

<div
class="personagem"
id="jogador">

🏓

<span class="nome">
Kelvin
</span>

</div>

<!-- =========================
ADVERSÁRIO
========================= -->

<div
class="personagem"
id="adversario">

⚽

<span class="nome">
Sperandio
</span>

</div>

<!-- =========================
MENSAGEM
========================= -->

<div id="mensagem">

⚔️ Kelvin vs Sperandio! O duelo começou!

</div>

<!-- =========================
CONTROLES
========================= -->

<div id="controles">

<button id="btnTopspin" onclick="atacar()">

🏓<br>
TOPSPIN

</button>

<button id="btnSmash" onclick="smash()">

🔥<br>
SMASH

</button>

<button id="btnDefender" onclick="defender()">

🛡️<br>
DEFENDER

</button>

</div>

<!-- =========================
TELA FINAL
========================= -->

<div id="fim">

<h2 id="tituloFim">
🏆 VITÓRIA!
</h2>

<p id="textoFim">
Você venceu!
</p>

<button onclick="location.reload()">
🔄 Jogar novamente
</button>

</div>

</div>

<script>

/* =========================
ESTADO DO RPG
========================= */

let vidaJogador = 100;

let energia = 100;

let vidaAdversario = 100;

let defendendo = false;


/* =========================
PROGRESSÃO
========================= */

let nivel =
Number(localStorage.getItem("rpgNivel")) || 1;

let xp =
Number(localStorage.getItem("rpgXP")) || 0;

let moedas =
Number(localStorage.getItem("rpgMoedas")) || 0;


let xpProximo =
nivel * 100;


/* =========================
ATUALIZAR RPG
========================= */

function atualizarRPG(){

    xpProximo = nivel * 100;

    document.getElementById("nivel").innerText =
        nivel;

    document.getElementById("xp").innerText =
        xp;

    document.getElementById("xpProximo").innerText =
        xpProximo;

    document.getElementById("moedas").innerText =
        moedas;

}


/* =========================
GANHAR XP
========================= */

function ganharXP(valor){

    xp += valor;

    let subiuNivel = false;

    while(xp >= xpProximo){

        xp -= xpProximo;

        nivel++;

        xpProximo = nivel * 100;

        subiuNivel = true;

    }

    localStorage.setItem(
        "rpgNivel",
        nivel
    );

    localStorage.setItem(
        "rpgXP",
        xp
    );

    if(subiuNivel){

        mensagem(
            "🎉 LEVEL UP! Kelvin chegou ao nível " +
            nivel +
            "!"
        );

    }

    atualizarRPG();

}


/* =========================
GANHAR MOEDAS
========================= */

function ganharMoedas(valor){

    moedas += valor;

    localStorage.setItem(
        "rpgMoedas",
        moedas
    );

    atualizarRPG();

}


/* =========================
ATUALIZAR TELA
========================= */

function atualizar(){

    document.getElementById(
        "vidaJogador"
    ).style.width =
        vidaJogador + "%";


    document.getElementById(
        "energiaJogador"
    ).style.width =
        energia + "%";


    document.getElementById(
        "vidaAdversario"
    ).style.width =
        vidaAdversario + "%";


    document.getElementById(
        "vidaTexto"
    ).innerText =
        vidaJogador;


    document.getElementById(
        "energiaTexto"
    ).innerText =
        energia;


    document.getElementById(
        "vidaAdvTexto"
    ).innerText =
        vidaAdversario;

}


/* =========================
BLOQUEAR CONTROLES
========================= */

function bloquearControles(){

    document.getElementById(
        "btnTopspin"
    ).disabled = true;

    document.getElementById(
        "btnSmash"
    ).disabled = true;

    document.getElementById(
        "btnDefender"
    ).disabled = true;

}


/* =========================
ATAQUE NORMAL
========================= */

function atacar(){

    if(vidaJogador <= 0) return;

    if(energia < 10){

        mensagem(
            "⚡ Kelvin está sem energia!"
        );

        return;

    }

    energia -= 10;

    let dano =
        Math.floor(
            Math.random() * 11
        ) + 10;


    vidaAdversario -= dano;


    mensagem(
        "🏓 TOPSPIN! Kelvin causou " +
        dano +
        " de dano!"
    );


    verificarFim();


    if(
        vidaAdversario > 0
    ){

        setTimeout(
            turnoAdversario,
            700
        );

    }


    atualizar();

}


/* =========================
SMASH
========================= */

function smash(){

    if(vidaJogador <= 0) return;

    if(energia < 30){

        mensagem(
            "⚡ Energia insuficiente para o SMASH!"
        );

        return;

    }


    energia -= 30;


    let dano =
        Math.floor(
            Math.random() * 21
        ) + 20;


    vidaAdversario -= dano;


    mensagem(
        "🔥 SMASH DEVASTADOR! Kelvin causou " +
        dano +
        " de dano!"
    );


    verificarFim();


    if(
        vidaAdversario > 0
    ){

        setTimeout(
            turnoAdversario,
            700
        );

    }


    atualizar();

}


/* =========================
DEFENDER
========================= */

function defender(){

    if(vidaJogador <= 0) return;

    defendendo = true;

    energia += 15;


    if(energia > 100)
        energia = 100;


    mensagem(
        "🛡️ Kelvin entrou em posição defensiva!"
    );


    setTimeout(
        turnoAdversario,
        500
    );


    atualizar();

}


/* =========================
TURNO ADVERSÁRIO
========================= */

function turnoAdversario(){

    if(
        vidaAdversario <= 0 ||
        vidaJogador <= 0
    ){

        return;

    }


    let dano =
        Math.floor(
            Math.random() * 16
        ) + 8;


    if(defendendo){

        dano =
            Math.floor(
                dano / 2
            );

        defendendo = false;

        mensagem(
            "🛡️ Kelvin defendeu o ataque de Sperandio!"
        );

    }else{

        mensagem(
            "⚽ Sperandio atacou!"
        );

    }


    vidaJogador -= dano;


    if(
        vidaJogador < 0
    )
        vidaJogador = 0;


    atualizar();


    verificarFim();

}


/* =========================
FINAL
========================= */

function verificarFim(){

    if(
        vidaAdversario <= 0
    ){

        vidaAdversario = 0;

        bloquearControles();

        ganharXP(100);

        ganharMoedas(50);

        atualizar();

        document.getElementById(
            "fim"
        ).style.display =
            "flex";


        document.getElementById(
            "tituloFim"
        ).innerText =
            "🏆 VITÓRIA!";


        document.getElementById(
            "textoFim"
        ).innerHTML =

            "🔥 Kelvin derrotou Sperandio!<br><br>" +

            "⭐ +100 XP<br>" +

            "🪙 +50 moedas<br><br>" +

            "O caminho para o Mundo dos Esportes começou!";

        return;

    }


    if(
        vidaJogador <= 0
    ){

        vidaJogador = 0;

        bloquearControles();

        atualizar();

        document.getElementById(
            "fim"
        ).style.display =
            "flex";


        document.getElementById(
            "tituloFim"
        ).innerText =
            "💀 DERROTA";


        document.getElementById(
            "textoFim"
        ).innerHTML =

            "Sperandio venceu desta vez...<br><br>" +

            "🏓 Não desista, Kelvin!";

    }

}


/* =========================
MENSAGEM
========================= */

function mensagem(texto){

    document.getElementById(
        "mensagem"
    ).innerText =
        texto;

}


/* =========================
INICIAR
========================= */

atualizar();

atualizarRPG();

</script>

</body>

</html>
